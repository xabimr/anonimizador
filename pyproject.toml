[project]
name = "anonimizador"
version = "1.0.0"
description = "Anonimización local de documentos (.docx, .pdf, .txt, .md) con Presidio y spaCy"
requires-python = ">=3.12"
dependencies = [
    "presidio-analyzer>=2.2.364",
    "spacy>=3.8.16,<3.9",
    "es-core-news-lg @ https://github.com/explosion/spacy-models/releases/download/es_core_news_lg-3.8.0/es_core_news_lg-3.8.0-py3-none-any.whl",
    "pymupdf>=1.28.2",
    "pymupdf4llm>=1.28.2",
    "pywebview>=6.2.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
